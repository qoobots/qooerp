  <!-- 标题背景 -->
  <rect x="0" y="0" width="1400" height="55" fill="url(#headerGrad)"/>
  <text x="700" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold">QooERP 整体系统架构图</text>
  <text x="700" y="52" text-anchor="middle" fill="#8899aa" font-size="11">基于工程实际代码结构 · 2026-07-07</text>

  <!-- ======================== 第一层：客户端层 ======================== -->
  <rect x="40" y="70" width="1320" height="95" rx="8" fill="#f0f0ff" stroke="#667eea" stroke-width="1.5"/>
  <text x="55" y="92" fill="#667eea" font-size="14" font-weight="bold">客户端层 Client Layer</text>

  <!-- Web -->
  <rect x="70" y="102" width="260" height="50" rx="6" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="200" y="122" text-anchor="middle" fill="white" font-size="13" font-weight="bold">🌐 Web 浏览器</text>
  <text x="200" y="140" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="10">Vue 3 + TypeScript + TDesign</text>

  <!-- Desktop -->
  <rect x="360" y="102" width="260" height="50" rx="6" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="490" y="122" text-anchor="middle" fill="white" font-size="13" font-weight="bold">💻 Desktop 桌面端</text>
  <text x="490" y="140" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="10">Electron + Vue 3 + TDesign</text>

  <!-- Mobile -->
  <rect x="650" y="102" width="260" height="50" rx="6" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="780" y="122" text-anchor="middle" fill="white" font-size="13" font-weight="bold">📱 Mobile 移动端</text>
  <text x="780" y="140" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="10">Capacitor + Vue 3 + TDesign Mobile</text>

  <!-- Monorepo -->
  <rect x="940" y="102" width="400" height="50" rx="6" fill="#f8f9ff" stroke="#667eea" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="1140" y="120" text-anchor="middle" fill="#667eea" font-size="11" font-weight="bold">qooerp-frontend Monorepo</text>
  <text x="1140" y="138" text-anchor="middle" fill="#667eea" font-size="9">packages/{web,desktop,mobile} + shared/</text>

  <!-- 箭头：客户端 -> 网关 -->
  <line x1="490" y1="155" x2="490" y2="195" stroke="#f5576c" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="780" y1="155" x2="780" y2="195" stroke="#f5576c" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="195" stroke="#f5576c" stroke-width="2"/>

  <!-- ======================== 第二层：网关层 ======================== -->
  <rect x="300" y="180" width="800" height="55" rx="8" fill="#fff0f5" stroke="#f5576c" stroke-width="1.5"/>
  <rect x="400" y="192" width="600" height="32" rx="6" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="700" y="206" text-anchor="middle" fill="white" font-size="13" font-weight="bold">qooerp-gateway :8000 — Spring Cloud Gateway</text>
  <text x="700" y="222" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">路由转发 | 统一鉴权(JWT) | 限流熔断(Sentinel) | 负载均衡(LoadBalancer) | 请求日志</text>
  <text x="310" y="212" fill="#f5576c" font-size="12" font-weight="bold">API 网关</text>

  <!-- 箭头：网关 -> 各层服务 -->
  <line x1="700" y1="235" x2="700" y2="270" stroke="#4facfe" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ======================== 第三层：P0 核心基础服务 ======================== -->
  <rect x="40" y="275" width="1320" height="155" rx="8" fill="#f0f8ff" stroke="#4facfe" stroke-width="1.5"/>
  <text x="55" y="297" fill="#4facfe" font-size="14" font-weight="bold">P0 核心基础服务 Core Services (basic-core-services/)</text>

  <!-- Auth -->
  <rect x="60" y="308" width="230" height="50" rx="6" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="175" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">qooerp-auth :8001</text>
  <text x="175" y="342" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">认证授权 · OAuth2/OIDC/JWT/MFA</text>
  <text x="175" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">✅ 94 Java文件 · context-path=/auth</text>

  <!-- System -->
  <rect x="310" y="308" width="230" height="50" rx="6" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="425" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">qooerp-system :8083</text>
  <text x="425" y="342" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">系统管理 · 配置/日志/字典/监控</text>
  <text x="425" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">✅ 68 Java文件 · start/service 分离</text>

  <!-- Permission -->
  <rect x="560" y="308" width="230" height="50" rx="6" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="675" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">qooerp-permission :8082</text>
  <text x="675" y="342" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">权限管理 · RBAC+ABAC/菜单/资源</text>
  <text x="675" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">✅ 75 Java文件 · start/service 分离</text>

  <!-- User -->
  <rect x="810" y="308" width="230" height="50" rx="6" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="925" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">qooerp-user :8084</text>
  <text x="925" y="342" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">用户管理 · 用户/角色/组织关联</text>
  <text x="925" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">🔶 仅启动类 · start/service 分离</text>

