  <text x="155" y="518" text-anchor="middle" fill="white" font-size="11" font-weight="bold">qooerp-hr</text>
  <text x="155" y="534" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">人力资源管理</text>

  <rect x="270" y="498" width="190" height="45" rx="6" fill="url(#bizGrad)" filter="url(#shadow)"/>
