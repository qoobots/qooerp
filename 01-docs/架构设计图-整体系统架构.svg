  <rect x="270" y="648" width="190" height="45" rx="6" fill="url(#expandGrad)" filter="url(#shadow)"/>
  <text x="365" y="668" text-anchor="middle" fill="white" font-size="11" font-weight="bold">qooerp-project</text>
  <text x="365" y="684" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">项目管理</text>

  <rect x="480" y="648" width="190" height="45" rx="6" fill="url(#expandGrad)" filter="url(#shadow)"/>
