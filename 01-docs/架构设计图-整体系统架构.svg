  <text x="785" y="518" text-anchor="middle" fill="white" font-size="11" font-weight="bold">qooerp-sales</text>
  <text x="785" y="534" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">销售管理</text>

  <rect x="900" y="498" width="190" height="45" rx="6" fill="url(#bizGrad)" filter="url(#shadow)"/>
  <text x="995" y="518" text-anchor="middle" fill="white" font-size="11" font-weight="bold">qooerp-inventory</text>
