  <rect x="1060" y="308" width="230" height="50" rx="6" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="1175" y="325" text-anchor="middle" fill="white" font-size="12" font-weight="bold">qooerp-organization :8085</text>
  <text x="1175" y="342" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">组织管理 · 组织/部门/岗位</text>
  <text x="1175" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="8">✅ 42 Java文件 · start/service 分离</text>

